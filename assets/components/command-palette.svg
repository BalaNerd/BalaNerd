<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .bg { fill: #161B22; }
      .bg-search { fill: #0D1117; }
      .bg-item { fill: #21262D; }
      .border { stroke: #30363D; stroke-width: 1px; }
      .text-main { fill: #F8FAFC; font-size: 12px; font-weight: 500; }
      .text-muted { fill: #8892A4; font-size: 11px; font-weight: 400; }
      .text-accent { fill: #3B82F6; font-size: 11px; font-weight: 500; }
      .text-green { fill: #2EA043; font-size: 11px; font-weight: 500; }
      .kbd { fill: #30363D; stroke: #484F58; stroke-width: 1px; rx: 4px; }
      .kbd-text { fill: #F8FAFC; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="420" height="200" rx="10" class="bg border" />

  <!-- Search Bar Header -->
  <g transform="translate(12, 12)">
    <rect width="396" height="34" rx="6" class="bg-search border" />
    <path d="M12 11 L18 17 M16 13 A 4 4 0 1 1 8 13 A 4 4 0 0 1 16 13" stroke="#8892A4" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <text x="28" y="21" class="text-muted">Search workspace or jump to...</text>
    
    <!-- KBD Badge -->
    <rect x="352" y="7" width="34" height="20" rx="4" class="kbd" />
    <text x="369" y="21" class="kbd-text mono" text-anchor="middle">⌘K</text>
  </g>

  <!-- Command Palette Items List -->
  <g transform="translate(12, 54)">
    <!-- Item 1 (Active Focus - Highlighted) -->
    <g transform="translate(0, 4)">
      <rect width="396" height="30" rx="6" class="bg-item border" />
      <circle cx="16" cy="15" r="3.5" fill="#3B82F6" />
      <text x="28" y="19" class="text-main">Current Focus</text>
      <text x="384" y="19" class="text-accent mono" text-anchor="end">Aegis Sentinel</text>
    </g>

    <!-- Item 2 (Status) -->
    <g transform="translate(0, 38)">
      <circle cx="16" cy="15" r="3.5" fill="#2EA043" />
      <text x="28" y="19" class="text-main">System Status</text>
      <text x="384" y="19" class="text-green mono" text-anchor="end">Production Operational</text>
    </g>

    <!-- Item 3 (Stack) -->
    <g transform="translate(0, 72)">
      <circle cx="16" cy="15" r="3.5" fill="#8892A4" />
      <text x="28" y="19" class="text-main">Core Architecture</text>
      <text x="384" y="19" class="text-muted mono" text-anchor="end">FastAPI · Next.js · MLOps</text>
    </g>

    <!-- Item 4 (Location) -->
    <g transform="translate(0, 106)">
      <circle cx="16" cy="15" r="3.5" fill="#8892A4" />
      <text x="28" y="19" class="text-main">Uplink Station</text>
      <text x="384" y="19" class="text-muted mono" text-anchor="end">Chennai, IN (UTC+5:30)</text>
    </g>
  </g>
</svg>
