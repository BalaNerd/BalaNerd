<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">

  <!-- Card background -->
  <rect width="760" height="220" rx="8" fill="#0D1117"/>

  <!-- ────────────────────────────────────────
       LEFT · TYPOGRAPHY
  ──────────────────────────────────────── -->

  <!-- Overline category -->
  <text x="40" y="50"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="10" font-weight="600" letter-spacing="2.5" fill="#58A6FF">
    BACKEND ENGINEER  ·  AI ENGINEER  ·  FULL STACK
  </text>

  <!-- Name — primary identity -->
  <text x="40" y="104"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="44" font-weight="700" fill="#E6EDF3">
    S Bala Raju
  </text>

  <!-- Bio -->
  <text x="40" y="134"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" fill="#8B949E">
    Building intelligent software at the intersection
  </text>
  <text x="40" y="154"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" fill="#8B949E">
    of backend engineering, AI, and scalable systems.
  </text>

  <!-- Location chip -->
  <rect x="40" y="172" width="204" height="27" rx="6"
    fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="54" y="190"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12" fill="#8B949E">📍 Chennai, India · UTC +05:30</text>

  <!-- ────────────────────────────────────────
       RIGHT · SYSTEM TOPOLOGY
       Hub-and-spoke: FastAPI core connected to
       Python, ML/AI, Postgres, Next.js nodes
       with Docker + Redis peripherals
  ──────────────────────────────────────── -->

  <!-- Depth cross-connections (faintest, drawn first) -->
  <line x1="490" y1="65" x2="490" y2="157" stroke="#1C2128" stroke-width="0.75"/>
  <line x1="638" y1="65" x2="638" y2="157" stroke="#1C2128" stroke-width="0.75"/>

  <!-- Peripheral spoke lines -->
  <line x1="564" y1="110" x2="564" y2="42" stroke="#1C2128" stroke-width="1"/>
  <line x1="564" y1="110" x2="564" y2="178" stroke="#1C2128" stroke-width="1"/>

  <!-- Primary hub spokes -->
  <line x1="564" y1="110" x2="490" y2="65" stroke="#21262D" stroke-width="1.5"/>
  <line x1="564" y1="110" x2="638" y2="65" stroke="#21262D" stroke-width="1.5"/>
  <line x1="564" y1="110" x2="638" y2="157" stroke="#21262D" stroke-width="1.5"/>
  <line x1="564" y1="110" x2="490" y2="157" stroke="#21262D" stroke-width="1.5"/>

  <!-- Docker node (top peripheral) -->
  <circle cx="564" cy="29" r="12" fill="#0D1117" stroke="#2496ED" stroke-width="1" opacity="0.55"/>
  <text x="564" y="33.5" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="7" fill="#2496ED" opacity="0.55">Docker</text>

  <!-- Redis node (bottom peripheral) -->
  <circle cx="564" cy="191" r="12" fill="#0D1117" stroke="#DC382D" stroke-width="1" opacity="0.55"/>
  <text x="564" y="195.5" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="7" fill="#DC382D" opacity="0.55">Redis</text>

  <!-- Python node (top-left) -->
  <circle cx="490" cy="65" r="21" fill="#161B22" stroke="#3572A5" stroke-width="1.5"/>
  <text x="490" y="61" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="9.5" fill="#58A6FF" font-weight="600">Python</text>
  <text x="490" y="73.5" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="7.5" fill="#8B949E">Backend</text>

  <!-- ML/AI node (top-right) -->
  <circle cx="638" cy="65" r="21" fill="#161B22" stroke="#D29922" stroke-width="1.5"/>
  <text x="638" y="61" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="9.5" fill="#D29922" font-weight="600">PyTorch</text>
  <text x="638" y="73.5" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="7.5" fill="#8B949E">ML · AI</text>

  <!-- Central hub (FastAPI) — largest node, blue ring -->
  <circle cx="564" cy="110" r="32" fill="#161B22" stroke="#1F6FEB" stroke-width="2"/>
  <circle cx="564" cy="110" r="24" fill="#0D1117"/>
  <text x="564" y="107" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="11" fill="#58A6FF" font-weight="700">FastAPI</text>
  <text x="564" y="120" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="8" fill="#8B949E">Core API</text>

  <!-- Postgres node (bottom-right) -->
  <circle cx="638" cy="157" r="21" fill="#161B22" stroke="#336791" stroke-width="1.5"/>
  <text x="638" y="153" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="9.5" fill="#58A6FF" font-weight="600">Postgres</text>
  <text x="638" y="165.5" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="7.5" fill="#8B949E">Storage</text>

  <!-- Next.js node (bottom-left) -->
  <circle cx="490" cy="157" r="21" fill="#161B22" stroke="#8B949E" stroke-width="1"/>
  <text x="490" y="153" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="9.5" fill="#E6EDF3" font-weight="600">Next.js</text>
  <text x="490" y="165.5" text-anchor="middle"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="7.5" fill="#8B949E">Frontend</text>

</svg>
