<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 320" width="412" height="320">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'SF Mono', 'Roboto Mono', monospace; }
      @keyframes cc-flow {
        0%,100%{ opacity:.4; transform:translateX(0); }
        50%     { opacity:1;  transform:translateX(8px); }
      }
      @keyframes cc-pulse {
        0%,100%{ opacity:.6; } 50%{ opacity:1; }
      }
      .flow-a { animation: cc-flow 2.0s ease-in-out 0.0s infinite; }
      .flow-b { animation: cc-flow 2.0s ease-in-out 0.4s infinite; }
      .flow-c { animation: cc-flow 2.0s ease-in-out 0.8s infinite; }
      .cc-live { animation: cc-pulse 2.2s ease-in-out infinite; }
    </style>
    <pattern id="dots-cc" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#F8FAFC" fill-opacity=".04"/>
    </pattern>
    <linearGradient id="fade-cc" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#161B22" stop-opacity="0"/>
      <stop offset="100%" stop-color="#161B22" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="queue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2EA043" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#2EA043" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <rect width="412" height="320" rx="12" fill="#161B22"/>
  <rect width="412" height="320" rx="12" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- Illustration zone -->
  <rect width="412" height="160" rx="12" fill="#0F1117"/>
  <rect x="0" y="12" width="412" height="148" fill="#0F1117"/>
  <rect width="412" height="160" fill="url(#dots-cc)"/>

  <!-- Queue flow illustration: users → station → kitchen → ready -->
  <g transform="translate(20, 32)">
    <!-- User queue nodes (left side) -->
    <circle cx="28" cy="50" r="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="28" cy="50" r="4"  fill="#4B5362"/>
    <circle cx="28" cy="78" r="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="28" cy="78" r="4"  fill="#4B5362"/>
    <circle cx="28" cy="106" r="10" fill="#161B22" stroke="#2EA043" stroke-width="1"/>
    <circle cx="28" cy="106" r="4"  fill="#2EA043" class="cc-live"/>

    <!-- Flow arrows — animated -->
    <g class="flow-a">
      <line x1="42" y1="50"  x2="100" y2="50"  stroke="#30363D" stroke-width="1.5"/>
      <polygon points="100,46 108,50 100,54" fill="#30363D"/>
    </g>
    <g class="flow-b">
      <line x1="42" y1="78"  x2="100" y2="78"  stroke="#30363D" stroke-width="1.5"/>
      <polygon points="100,74 108,78 100,82" fill="#30363D"/>
    </g>
    <g class="flow-c">
      <line x1="42" y1="106" x2="100" y2="106" stroke="#2EA043" stroke-width="1.5" stroke-opacity=".7"/>
      <polygon points="100,102 108,106 100,110" fill="#2EA043" fill-opacity=".7"/>
    </g>

    <!-- Order station (center) -->
    <rect x="108" y="28" width="80" height="96" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="148" y="54" font-size="8" fill="#4B5362" text-anchor="middle" letter-spacing="1" class="mono">ORDER</text>
    <text x="148" y="66" font-size="8" fill="#4B5362" text-anchor="middle" letter-spacing="1" class="mono">STATION</text>

    <!-- Queue progress bar inside station -->
    <rect x="120" y="76" width="56" height="6" rx="3" fill="#1C2128"/>
    <rect x="120" y="76" width="36" height="6" rx="3" fill="url(#queue-grad)"/>
    <text x="148" y="96" font-size="7" fill="#4B5362" text-anchor="middle" class="mono">Queue: 3</text>
    <text x="148" y="108" font-size="7" fill="#2EA043" text-anchor="middle" class="mono">ETA: 8 min</text>

    <!-- Arrow: station → kitchen -->
    <g class="flow-a">
      <line x1="188" y1="76" x2="226" y2="76" stroke="#30363D" stroke-width="1.5"/>
      <polygon points="226,72 234,76 226,80" fill="#30363D"/>
    </g>

    <!-- Kitchen module (right) -->
    <rect x="234" y="28" width="80" height="96" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="274" y="54" font-size="8" fill="#4B5362" text-anchor="middle" letter-spacing="1" class="mono">KITCHEN</text>
    <text x="274" y="66" font-size="8" fill="#4B5362" text-anchor="middle" letter-spacing="1" class="mono">MODULE</text>
    <circle cx="274" cy="82" r="6" fill="#1C2128" stroke="#2EA043" stroke-width="1" class="cc-live"/>
    <circle cx="274" cy="82" r="2" fill="#2EA043" class="cc-live"/>
    <text x="274" y="104" font-size="7" fill="#94A3B8" text-anchor="middle" class="mono">3 active</text>

    <!-- Ready notification -->
    <rect x="330" y="60" width="36" height="32" rx="6" fill="#0D1117" stroke="#2EA043" stroke-width="1" class="cc-live"/>
    <text x="348" y="79" font-size="8" fill="#2EA043" text-anchor="middle" class="mono">✓</text>
  </g>

  <rect width="412" height="160" fill="url(#fade-cc)"/>

  <!-- Content -->
  <g transform="translate(24, 172)">
    <rect width="82" height="18" rx="9" fill="#1C2128"/>
    <text x="11" y="12.5" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="1.4" class="mono">PLATFORM</text>

    <circle cx="106" cy="9" r="3.5" fill="#2EA043" class="cc-live"/>
    <text x="116" y="13" font-size="10" font-weight="500" fill="#94A3B8">Live</text>

    <text x="0" y="44" font-size="19" font-weight="700" fill="#F8FAFC" letter-spacing="-.5">CanteenConnect</text>

    <text x="0" y="64" font-size="12" font-weight="400" fill="#94A3B8">Smart canteen management with real-time ordering,</text>
    <text x="0" y="80" font-size="12" font-weight="400" fill="#94A3B8">queue optimization, and kitchen coordination.</text>

    <text x="0" y="104" font-size="9.5" font-weight="400" fill="#4B5362" class="mono">Node.js · React · MongoDB · Socket.io · Redis</text>

    <text x="0"  y="122" font-size="11" font-weight="500" fill="#3B82F6">GitHub →</text>
    <text x="68" y="122" font-size="11" font-weight="400" fill="#4B5362">Live Demo →</text>
  </g>
</svg>
