<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', 'Fira Code', 'JetBrains Mono', ui-monospace, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .bg { fill: #0D1117; }
      .border { stroke: #21262D; stroke-width: 1; }
      .node-bg { fill: #161B22; stroke: #30363D; stroke-width: 1; }
      .node-accent { fill: #161B22; stroke: #58A6FF; stroke-width: 1.5; }
      .title { fill: #E6EDF3; font-size: 13px; font-weight: 600; }
      .sub { fill: #8B949E; font-size: 10px; }
      .code { fill: #58A6FF; font-size: 10px; }
      .wire { stroke: #30363D; stroke-width: 1; fill: none; }
      .wire-active { stroke: #58A6FF; stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
      .axis { stroke: #21262D; stroke-width: 0.5; stroke-dasharray: 2 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="220" rx="4" class="bg border"/>

  <!-- Blueprint Header -->
  <text x="24" y="32" class="mono sub">EXHIBIT 01 // ARCHITECTURAL BLUEPRINT</text>
  <text x="24" y="48" class="sans title">Aegis Sentinel — Real-Time Disaster Intelligence Engine</text>

  <!-- Grid Axis Lines -->
  <line x1="24" y1="65" x2="736" y2="65" stroke="#21262D" stroke-width="1"/>

  <!-- Data Flow Nodes -->

  <!-- Step A: Ingestion -->
  <g transform="translate(24, 85)">
    <rect width="120" height="65" rx="3" class="node-bg"/>
    <text x="12" y="22" class="mono code">01. INGESTION</text>
    <text x="12" y="38" class="sans title" font-size="11">USGS &amp; FIRMS</text>
    <text x="12" y="52" class="mono sub">Stream Polling</text>
  </g>

  <!-- Wire A -> B -->
  <path d="M 144 117 L 174 117" class="wire-active"/>

  <!-- Step B: Feature Store & Vector DB -->
  <g transform="translate(174, 85)">
    <rect width="130" height="65" rx="3" class="node-accent"/>
    <text x="12" y="22" class="mono code">02. FEATURE STORE</text>
    <text x="12" y="38" class="sans title" font-size="11">Redis + Postgres</text>
    <text x="12" y="52" class="mono sub">Vector Embeddings</text>
  </g>

  <!-- Wire B -> C -->
  <path d="M 304 117 L 334 117" class="wire"/>

  <!-- Step C: RAG Inference -->
  <g transform="translate(334, 85)">
    <rect width="130" height="65" rx="3" class="node-bg"/>
    <text x="12" y="22" class="mono code">03. RAG INFERENCE</text>
    <text x="12" y="38" class="sans title" font-size="11">PyTorch / FastAPI</text>
    <text x="12" y="52" class="mono sub">Contextual Query</text>
  </g>

  <!-- Wire C -> D -->
  <path d="M 464 117 L 494 117" class="wire-active"/>

  <!-- Step D: MLOps Drift Watcher -->
  <g transform="translate(494, 85)">
    <rect width="130" height="65" rx="3" class="node-bg"/>
    <text x="12" y="22" class="mono code">04. MLOPS DRIFT</text>
    <text x="12" y="38" class="sans title" font-size="11">PSI Monitoring</text>
    <text x="12" y="52" class="mono sub">Auto-Retrain Loop</text>
  </g>

  <!-- Wire D -> E -->
  <path d="M 624 117 L 654 117" class="wire"/>

  <!-- Step E: Alert Dispatch -->
  <g transform="translate(654, 85)">
    <rect width="82" height="65" rx="3" class="node-bg" stroke="#238636"/>
    <text x="10" y="22" class="mono" fill="#2EA043" font-size="10">05. ALERT</text>
    <text x="10" y="38" class="sans title" font-size="11">PubSub</text>
    <text x="10" y="52" class="mono sub">&lt; 12ms</text>
  </g>

  <!-- Blueprint Footer Metadata -->
  <line x1="24" y1="175" x2="736" y2="175" stroke="#21262D" stroke-width="1"/>
  <text x="24" y="196" class="mono sub">TECH STACK: FastAPI · Next.js · PostgreSQL · Redis · PyTorch · Docker</text>
  <text x="736" y="196" text-anchor="end" class="mono sub" fill="#58A6FF">STATUS: PRODUCTION ACTIVE</text>
</svg>
