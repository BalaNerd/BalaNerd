<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210">
  <defs>
    <linearGradient id="aegis-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="760" height="210" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <rect width="760" height="4" rx="2" fill="url(#aegis-grad)"/>

  <!-- Left Content -->
  <g transform="translate(28, 24)">
    <!-- Header -->
    <path d="M 0 3 C 0 1.34 1.34 0 3 0 L 11 0 C 12.66 0 14 1.34 14 3 L 14 13 C 14 14.66 12.66 16 11 16 L 3 16 C 1.34 16 0 14.66 0 13 Z" fill="#94A3B8"/>
    <text x="22" y="14" class="sans" font-size="16" font-weight="700" fill="#60A5FA">BalaNerd / aegis-sentinel</text>

    <!-- Badges -->
    <rect x="235" y="0" width="54" height="20" rx="10" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="262" y="14" class="sans" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Public</text>

    <rect x="296" y="0" width="94" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <circle cx="310" cy="10" r="3.5" fill="#10B981"/>
    <text x="350" y="14" class="sans" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">● Production</text>

    <rect x="397" y="0" width="48" height="20" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="421" y="14" class="sans" font-size="11" font-weight="600" fill="#A5B4FC" text-anchor="middle">v2.0</text>

    <!-- Subtitle -->
    <text x="0" y="44" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">AI-Powered Real-Time Disaster Intelligence &amp; MLOps Drift Platform</text>
    <text x="0" y="64" class="sans" font-size="12" fill="#94A3B8">Ingests USGS/FIRMS satellite feeds → Feature Store → RAG Engine → Automated Retraining.</text>

    <!-- Tech Chips -->
    <g transform="translate(0, 84)">
      <rect x="0"   y="0" width="62" height="24" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="31"  y="16" class="mono" font-size="10" font-weight="600" fill="#60A5FA" text-anchor="middle">FastAPI</text>

      <rect x="70"  y="0" width="62" height="24" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="101" y="16" class="mono" font-size="10" font-weight="600" fill="#F8FAFC" text-anchor="middle">Next.js</text>

      <rect x="140" y="0" width="80" height="24" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="180" y="16" class="mono" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">PostgreSQL</text>

      <rect x="228" y="0" width="52" height="24" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="254" y="16" class="mono" font-size="10" font-weight="600" fill="#F87171" text-anchor="middle">Redis</text>

      <rect x="288" y="0" width="64" height="24" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="320" y="16" class="mono" font-size="10" font-weight="600" fill="#FB923C" text-anchor="middle">PyTorch</text>

      <rect x="360" y="0" width="58" height="24" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="389" y="16" class="mono" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">Docker</text>
    </g>

    <!-- Meta row -->
    <g transform="translate(0, 132)">
      <circle cx="6" cy="6" r="5" fill="#3572A5"/>
      <text x="18"  y="10" class="sans" font-size="12" fill="#94A3B8">Python</text>
      <text x="80"  y="10" class="sans" font-size="12" fill="#94A3B8">★ 14 Stars</text>
      <text x="150" y="10" class="sans" font-size="12" fill="#94A3B8">⑂ 4 Forks</text>
      <text x="220" y="10" class="mono" font-size="11" fill="#94A3B8">main (79c6788)</text>
    </g>
  </g>

  <!-- Right Architecture Panel -->
  <g transform="translate(500, 24)">
    <rect width="232" height="162" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

    <rect width="232" height="26" rx="8" fill="#21262D"/>
    <rect y="16" width="232" height="10" fill="#21262D"/>
    <text x="116" y="18" class="mono" font-size="10" font-weight="600" fill="#60A5FA" text-anchor="middle">SYSTEM METRICS</text>

    <g transform="translate(14, 40)">
      <text x="0" y="12" class="mono" font-size="10" fill="#34D399">✓ Ingress: 14 events/min</text>
      <text x="0" y="30" class="mono" font-size="10" fill="#60A5FA">⚡ RAG Search: 12ms</text>
      <text x="0" y="48" class="mono" font-size="10" fill="#A78BFA">⚙️ Feature Store: Active</text>
      <text x="0" y="66" class="mono" font-size="10" fill="#FBBF24">📊 Drift PSI: 0.02 (Stable)</text>
      <text x="0" y="84" class="mono" font-size="10" fill="#34D399">🛡️ Health Check: 200 OK</text>
      <text x="0" y="102" class="mono" font-size="10" fill="#94A3B8">🚀 Deploy: Production</text>
    </g>
  </g>
</svg>
