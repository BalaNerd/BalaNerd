<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208">
  <defs>
    <!-- Clips all children to the card's rounded corners -->
    <clipPath id="aegis-clip">
      <rect width="760" height="208" rx="8"/>
    </clipPath>
  </defs>

  <!-- ─────────────────────────────────────────────
       LAYER 1 · Card layers (inside clip)
  ───────────────────────────────────────────── -->
  <g clip-path="url(#aegis-clip)">

    <!-- Card base -->
    <rect width="760" height="208" fill="#161B22"/>

    <!-- Right sidebar -->
    <rect x="524" y="0" width="236" height="208" fill="#0D1117"/>

    <!-- Sidebar left divider -->
    <line x1="524" y1="0" x2="524" y2="208" stroke="#21262D" stroke-width="1"/>

    <!-- Blue top accent stripe -->
    <rect x="0" y="0" width="760" height="3" fill="#1F6FEB"/>

  </g>

  <!-- ─────────────────────────────────────────────
       LAYER 2 · Left column content
  ───────────────────────────────────────────── -->

  <!-- Repo icon (GitHub book icon) -->
  <g transform="translate(28, 26)">
    <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z" fill="#8B949E"/>
  </g>

  <!-- Repo name -->
  <text x="52" y="41"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15" font-weight="600" fill="#58A6FF">BalaNerd / aegis-sentinel</text>

  <!-- Status badges -->
  <!-- Public -->
  <rect x="270" y="26" width="50" height="18" rx="10" fill="none" stroke="#30363D" stroke-width="1"/>
  <text x="295" y="39" text-anchor="middle"
    font-family="-apple-system, sans-serif" font-size="11" fill="#8B949E">Public</text>
  <!-- Production -->
  <rect x="328" y="26" width="90" height="18" rx="10" fill="none" stroke="#238636" stroke-width="1"/>
  <circle cx="342" cy="35" r="3.5" fill="#3FB950"/>
  <text x="382" y="39" text-anchor="middle"
    font-family="-apple-system, sans-serif" font-size="11" fill="#3FB950">Production</text>
  <!-- Version -->
  <rect x="426" y="26" width="46" height="18" rx="10"
    fill="#1F6FEB" fill-opacity="0.15" stroke="#1F6FEB" stroke-width="1"/>
  <text x="449" y="39" text-anchor="middle"
    font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#58A6FF">v2.0</text>

  <!-- Description -->
  <text x="28" y="66"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13" fill="#E6EDF3">AI-powered disaster intelligence platform monitoring wildfires,</text>
  <text x="28" y="84"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="13" fill="#8B949E">earthquakes &amp; severe weather. USGS/FIRMS → RAG Engine → MLOps.</text>

  <!-- Tech chips -->
  <g transform="translate(28, 101)">
    <rect x="0"   y="0" width="54" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="27"  y="15" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10" fill="#8B949E">FastAPI</text>

    <rect x="62"  y="0" width="52" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="88"  y="15" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10" fill="#8B949E">Next.js</text>

    <rect x="122" y="0" width="72" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="158" y="15" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10" fill="#8B949E">PostgreSQL</text>

    <rect x="202" y="0" width="44" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="224" y="15" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10" fill="#8B949E">Redis</text>

    <rect x="254" y="0" width="52" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="280" y="15" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10" fill="#8B949E">Docker</text>

    <rect x="314" y="0" width="54" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="341" y="15" text-anchor="middle" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10" fill="#8B949E">PyTorch</text>
  </g>

  <!-- Separator -->
  <line x1="28" y1="140" x2="508" y2="140" stroke="#21262D" stroke-width="1"/>

  <!-- Stats row -->
  <g transform="translate(28, 154)">
    <circle cx="6" cy="6" r="5" fill="#3572A5"/>
    <text x="18"  y="10" font-family="-apple-system, sans-serif" font-size="12" fill="#8B949E">Python</text>
    <text x="76"  y="10" font-family="-apple-system, sans-serif" font-size="12" fill="#8B949E">★ 14</text>
    <text x="116" y="10" font-family="-apple-system, sans-serif" font-size="12" fill="#8B949E">⑂ 4</text>
    <text x="156" y="10" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="11" fill="#8B949E">main · 79c6788</text>
  </g>

  <!-- ─────────────────────────────────────────────
       LAYER 3 · Right sidebar content
  ───────────────────────────────────────────── -->

  <!-- Sidebar section label -->
  <text x="540" y="44"
    font-family="'SF Mono','Fira Code',ui-monospace,monospace"
    font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#6E7681">ARCHITECTURE</text>

  <!-- Sidebar separator -->
  <line x1="536" y1="54" x2="744" y2="54" stroke="#21262D" stroke-width="1"/>

  <!-- Metric 1 -->
  <rect x="536" y="66" width="3" height="14" rx="1.5" fill="#1F6FEB"/>
  <text x="546" y="77" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#6E7681">Data Sources</text>
  <text x="744" y="77" text-anchor="end" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#E6EDF3">USGS · FIRMS</text>

  <!-- Metric 2 -->
  <rect x="536" y="90" width="3" height="14" rx="1.5" fill="#1F6FEB"/>
  <text x="546" y="101" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#6E7681">Pipeline</text>
  <text x="744" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#E6EDF3">RAG + MLOps</text>

  <!-- Metric 3 -->
  <rect x="536" y="114" width="3" height="14" rx="1.5" fill="#3FB950"/>
  <text x="546" y="125" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#6E7681">Drift Index</text>
  <text x="744" y="125" text-anchor="end" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#3FB950">0.02 — Stable</text>

  <!-- Metric 4 -->
  <rect x="536" y="138" width="3" height="14" rx="1.5" fill="#3FB950"/>
  <text x="546" y="149" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#6E7681">API Health</text>
  <text x="744" y="149" text-anchor="end" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#3FB950">200 OK</text>

  <!-- Metric 5 -->
  <rect x="536" y="162" width="3" height="14" rx="1.5" fill="#D29922"/>
  <text x="546" y="173" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#6E7681">Stage</text>
  <text x="744" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',ui-monospace,monospace" font-size="10.5" fill="#D29922">MLOps v2</text>

  <!-- ─────────────────────────────────────────────
       LAYER 4 · Card border (drawn last, on top)
  ───────────────────────────────────────────── -->
  <rect width="760" height="208" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>

</svg>
