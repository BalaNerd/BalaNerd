<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 200" width="854" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .bg { fill: #161B22; }
      .bg-inner { fill: #0D1117; }
      .bg-chip { fill: #21262D; }
      .border { stroke: #30363D; stroke-width: 1px; }
      .border-accent { stroke: #3B82F6; stroke-width: 1px; }
      .text-title { fill: #3B82F6; font-size: 16px; font-weight: 600; }
      .text-owner { fill: #8892A4; font-size: 16px; font-weight: 400; }
      .text-main { fill: #F8FAFC; font-size: 13px; font-weight: 400; }
      .text-muted { fill: #8892A4; font-size: 11px; font-weight: 400; }
      .text-code { fill: #8892A4; font-size: 11px; font-weight: 400; }
      .badge-bg { fill: #21262D; stroke: #30363D; stroke-width: 1px; rx: 10px; }
      .badge-text { fill: #F8FAFC; font-size: 10px; font-weight: 500; }
    </style>
  </defs>

  <!-- Repository Card Container -->
  <rect width="854" height="200" rx="10" class="bg border" />

  <!-- Left Side: Repo Content (Width ~520px) -->
  <g transform="translate(24, 20)">
    <!-- Header: Repo Icon + Title + Badges -->
    <!-- Book/Repo Icon -->
    <path d="M 0 3 C 0 1.34 1.34 0 3 0 L 11 0 C 12.66 0 14 1.34 14 3 L 14 13 C 14 14.66 12.66 16 11 16 L 3 16 C 1.34 16 0 14.66 0 13 Z M 3 2 L 11 2 C 11.55 2 12 2.45 12 3 L 12 13 C 12 13.55 11.55 14 11 14 L 3 14 C 2.45 14 2 13.55 2 13 L 2 3 C 2 2.45 2.45 2 3 2 Z" fill="#8892A4" />
    <text x="22" y="14" class="text-owner">BalaNerd / </text>
    <text x="108" y="14" class="text-title">aegis-sentinel</text>

    <!-- Badges -->
    <rect x="235" y="0" width="54" height="18" rx="9" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="262" y="12" class="badge-text" text-anchor="middle">Public</text>

    <rect x="296" y="0" width="80" height="18" rx="9" fill="#1C2B1D" stroke="#2EA043" stroke-width="1" />
    <text x="336" y="12" fill="#2EA043" font-size="10" font-weight="600" text-anchor="middle">● Production</text>

    <rect x="383" y="0" width="46" height="18" rx="9" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <text x="406" y="12" fill="#3B82F6" font-size="10" font-weight="600" text-anchor="middle">v2.0</text>

    <!-- Problem & Solution Description -->
    <text x="0" y="44" class="text-main">AI-powered disaster intelligence platform monitoring wildfires, earthquakes &amp; severe weather.</text>
    <text x="0" y="64" class="text-muted">Ingests USGS/FIRMS feeds ➔ Feature Store ➔ RAG Knowledge Engine ➔ MLOps Drift Retraining.</text>

    <!-- Tech Chips Grid -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="62" height="22" rx="4" class="bg-chip border" />
      <text x="31" y="14" class="text-code mono" text-anchor="middle">FastAPI</text>

      <rect x="68" y="0" width="62" height="22" rx="4" class="bg-chip border" />
      <text x="99" y="14" class="text-code mono" text-anchor="middle">Next.js</text>

      <rect x="136" y="0" width="76" height="22" rx="4" class="bg-chip border" />
      <text x="174" y="14" class="text-code mono" text-anchor="middle">PostgreSQL</text>

      <rect x="218" y="0" width="52" height="22" rx="4" class="bg-chip border" />
      <text x="244" y="14" class="text-code mono" text-anchor="middle">Redis</text>

      <rect x="276" y="0" width="58" height="22" rx="4" class="bg-chip border" />
      <text x="305" y="14" class="text-code mono" text-anchor="middle">Docker</text>

      <rect x="340" y="0" width="58" height="22" rx="4" class="bg-chip border" />
      <text x="369" y="14" class="text-code mono" text-anchor="middle">PyTorch</text>
    </g>

    <!-- Meta / Language Row -->
    <g transform="translate(0, 126)">
      <circle cx="6" cy="6" r="5" fill="#3572A5" /> <!-- Python color -->
      <text x="18" y="10" class="text-muted">Python</text>
      <text x="75" y="10" class="text-muted">★ 14</text>
      <text x="115" y="10" class="text-muted">⑂ 4</text>
      <text x="155" y="10" class="text-muted mono">main (79c6788)</text>
    </g>
  </g>

  <!-- Right Side: Architecture / Micro UI Snippet Preview (Width ~270px) -->
  <g transform="translate(554, 20)">
    <rect width="276" height="160" rx="8" class="bg-inner border" />
    <!-- Snippet Header -->
    <rect width="276" height="24" rx="8" fill="#21262D" />
    <circle cx="12" cy="12" r="3.5" fill="#FF5F56" />
    <circle cx="22" cy="12" r="3.5" fill="#FFBD2E" />
    <circle cx="32" cy="12" r="3.5" fill="#27C93F" />
    <text x="138" y="16" class="text-code mono" text-anchor="middle" font-size="10">telemetry_stream.log</text>

    <!-- Snippet Code Content -->
    <g transform="translate(12, 38)">
      <text x="0" y="12" fill="#2EA043" font-size="10" class="mono">[OK] USGS Ingest: 14 events/min</text>
      <text x="0" y="28" fill="#3B82F6" font-size="10" class="mono">[AI] RAG Vector Search: 12ms</text>
      <text x="0" y="44" fill="#8892A4" font-size="10" class="mono">[ML] Feature Pipeline: Active</text>
      <text x="0" y="60" fill="#8892A4" font-size="10" class="mono">[SYS] Redis PubSub: Connected</text>
      <text x="0" y="76" fill="#D29922" font-size="10" class="mono">[MLOps] Drift PSI: 0.02 (Stable)</text>
      <text x="0" y="92" fill="#2EA043" font-size="10" class="mono">[API] Health Endpoint: 200 OK</text>
    </g>
  </g>
</svg>
