<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 200" width="854" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .bg { fill: #161B22; }
      .bg-inner { fill: #0D1117; }
      .bg-chip { fill: #21262D; }
      .border { stroke: #30363D; stroke-width: 1px; }
      .text-title { fill: #3B82F6; font-size: 16px; font-weight: 600; }
      .text-owner { fill: #8892A4; font-size: 16px; font-weight: 400; }
      .text-main { fill: #F8FAFC; font-size: 13px; font-weight: 400; }
      .text-muted { fill: #8892A4; font-size: 11px; font-weight: 400; }
      .text-code { fill: #8892A4; font-size: 11px; font-weight: 400; }
      .badge-text { fill: #F8FAFC; font-size: 10px; font-weight: 500; }
    </style>
  </defs>

  <!-- Repository Card Container -->
  <rect width="854" height="200" rx="10" class="bg border" />

  <!-- Left Side: Repo Content -->
  <g transform="translate(24, 20)">
    <!-- Header -->
    <path d="M 0 3 C 0 1.34 1.34 0 3 0 L 11 0 C 12.66 0 14 1.34 14 3 L 14 13 C 14 14.66 12.66 16 11 16 L 3 16 C 1.34 16 0 14.66 0 13 Z M 3 2 L 11 2 C 11.55 2 12 2.45 12 3 L 12 13 C 12 13.55 11.55 14 11 14 L 3 14 C 2.45 14 2 13.55 2 13 L 2 3 C 2 2.45 2.45 2 3 2 Z" fill="#8892A4" />
    <text x="22" y="14" class="text-owner">BalaNerd / </text>
    <text x="108" y="14" class="text-title">spendwise</text>

    <!-- Badges -->
    <rect x="195" y="0" width="54" height="18" rx="9" fill="#21262D" stroke="#30363D" stroke-width="1" />
    <text x="222" y="12" class="badge-text" text-anchor="middle">Public</text>

    <rect x="256" y="0" width="80" height="18" rx="9" fill="#1C2B1D" stroke="#2EA043" stroke-width="1" />
    <text x="296" y="12" fill="#2EA043" font-size="10" font-weight="600" text-anchor="middle">● Production</text>

    <rect x="343" y="0" width="46" height="18" rx="9" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <text x="366" y="12" fill="#3B82F6" font-size="10" font-weight="600" text-anchor="middle">v1.5</text>

    <!-- Problem & Solution Description -->
    <text x="0" y="44" class="text-main">Modern financial analytics engine with real-time transaction processing &amp; insights.</text>
    <text x="0" y="64" class="text-muted">Automates budget tracking, categorization, recurring analytics &amp; spending alerts.</text>

    <!-- Tech Chips Grid -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="62" height="22" rx="4" class="bg-chip border" />
      <text x="31" y="14" class="text-code mono" text-anchor="middle">FastAPI</text>

      <rect x="68" y="0" width="52" height="22" rx="4" class="bg-chip border" />
      <text x="94" y="14" class="text-code mono" text-anchor="middle">React</text>

      <rect x="126" y="0" width="76" height="22" rx="4" class="bg-chip border" />
      <text x="164" y="14" class="text-code mono" text-anchor="middle">PostgreSQL</text>

      <rect x="208" y="0" width="52" height="22" rx="4" class="bg-chip border" />
      <text x="234" y="14" class="text-code mono" text-anchor="middle">Redis</text>

      <rect x="266" y="0" width="68" height="22" rx="4" class="bg-chip border" />
      <text x="300" y="14" class="text-code mono" text-anchor="middle">Supabase</text>
    </g>

    <!-- Meta / Language Row -->
    <g transform="translate(0, 126)">
      <circle cx="6" cy="6" r="5" fill="#3572A5" /> <!-- Python color -->
      <text x="18" y="10" class="text-muted">Python</text>
      <text x="75" y="10" class="text-muted">★ 10</text>
      <text x="115" y="10" class="text-muted">⑂ 2</text>
      <text x="155" y="10" class="text-muted mono">main (a1b2c3d)</text>
    </g>
  </g>

  <!-- Right Side: Architecture Snippet Preview -->
  <g transform="translate(554, 20)">
    <rect width="276" height="160" rx="8" class="bg-inner border" />
    <rect width="276" height="24" rx="8" fill="#21262D" />
    <circle cx="12" cy="12" r="3.5" fill="#FF5F56" />
    <circle cx="22" cy="12" r="3.5" fill="#FFBD2E" />
    <circle cx="32" cy="12" r="3.5" fill="#27C93F" />
    <text x="138" y="16" class="text-code mono" text-anchor="middle" font-size="10">analytics_engine.py</text>

    <g transform="translate(12, 38)">
      <text x="0" y="12" fill="#2EA043" font-size="10" class="mono">[ASYNC] Ingest Worker: 1.2ms</text>
      <text x="0" y="28" fill="#3B82F6" font-size="10" class="mono">[SQL] Postgres Aggregation: OK</text>
      <text x="0" y="44" fill="#8892A4" font-size="10" class="mono">[CACHE] Redis Category Hit: 98%</text>
      <text x="0" y="60" fill="#8892A4" font-size="10" class="mono">[AUTH] Supabase JWT: Valid</text>
      <text x="0" y="76" fill="#2EA043" font-size="10" class="mono">[ANALYTICS] Monthly Budget: OK</text>
      <text x="0" y="92" fill="#3B82F6" font-size="10" class="mono">[SYNC] Ledger Update: Dispatched</text>
    </g>
  </g>
</svg>
