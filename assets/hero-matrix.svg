<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', 'Fira Code', 'JetBrains Mono', ui-monospace, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .grid-line { stroke: #21262D; stroke-width: 0.5; stroke-dasharray: 4 4; }
      .axis-line { stroke: #30363D; stroke-width: 1; }
      .data-path { stroke: #58A6FF; stroke-width: 1.5; fill: none; }
      .accent-dot { fill: #58A6FF; }
      .muted-text { fill: #8B949E; font-size: 10px; }
      .label-text { fill: #E6EDF3; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="180" rx="4" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="40" y1="30" x2="720" y2="30" class="grid-line"/>
  <line x1="40" y1="70" x2="720" y2="70" class="grid-line"/>
  <line x1="40" y1="110" x2="720" y2="110" class="grid-line"/>
  <line x1="40" y1="150" x2="720" y2="150" class="grid-line"/>

  <line x1="160" y1="20" x2="160" y2="160" class="grid-line"/>
  <line x1="300" y1="20" x2="300" y2="160" class="grid-line"/>
  <line x1="440" y1="20" x2="440" y2="160" class="grid-line"/>
  <line x1="580" y1="20" x2="580" y2="160" class="grid-line"/>

  <!-- Blueprint Node 1: Ingestion -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="80" height="40" rx="2" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="40" y="24" text-anchor="middle" class="mono label-text">INGEST</text>
    <text x="40" y="34" text-anchor="middle" class="mono muted-text" font-size="8">Async API</text>
  </g>

  <!-- Path 1 -> 2 -->
  <path d="M 140 60 L 200 60 L 200 100 L 220 100" stroke="#30363D" stroke-width="1" fill="none"/>
  <circle cx="140" cy="60" r="2.5" fill="#8B949E"/>

  <!-- Blueprint Node 2: Feature Store / Vector DB -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="100" height="40" rx="2" fill="#161B22" stroke="#58A6FF" stroke-width="1"/>
    <text x="50" y="24" text-anchor="middle" class="mono label-text" fill="#58A6FF">PIPELINE</text>
    <text x="50" y="34" text-anchor="middle" class="mono muted-text" font-size="8">FastAPI + Redis</text>
  </g>

  <!-- Path 2 -> 3 -->
  <path d="M 320 100 L 380 100 L 380 50 L 420 50" class="data-path"/>
  <circle cx="320" cy="100" r="3" class="accent-dot"/>

  <!-- Blueprint Node 3: Model Engine -->
  <g transform="translate(420, 30)">
    <rect x="0" y="0" width="90" height="40" rx="2" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="45" y="24" text-anchor="middle" class="mono label-text">MODEL</text>
    <text x="45" y="34" text-anchor="middle" class="mono muted-text" font-size="8">RAG / PyTorch</text>
  </g>

  <!-- Path 3 -> 4 -->
  <path d="M 510 50 L 570 50 L 570 120 L 600 120" stroke="#30363D" stroke-width="1" fill="none"/>

  <!-- Blueprint Node 4: Telemetry Output -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="90" height="40" rx="2" fill="#161B22" stroke="#238636" stroke-width="1"/>
    <text x="45" y="24" text-anchor="middle" class="mono label-text" fill="#2EA043">TELEMETRY</text>
    <text x="45" y="34" text-anchor="middle" class="mono muted-text" font-size="8">0.02 Drift PSI</text>
  </g>
  <circle cx="600" cy="120" r="3" fill="#2EA043"/>

  <!-- Architectural Labels -->
  <text x="40" y="168" class="mono muted-text">SYSTEM ARCHITECTURE MATRIX // V3.2</text>
  <text x="720" y="168" text-anchor="end" class="mono muted-text">LATENCY: 1.2ms · UPTIME: 99.98%</text>
</svg>
