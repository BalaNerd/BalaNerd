# 3D contribution graph
# Generates a 3D profile contribution calendar and commits the SVGs directly
# to the main branch. Embed via:
# https://raw.githubusercontent.com/BalaNerd/BalaNerd/main/profile-night-view.svg
#
# Generated SVG variants (all committed to main branch root):
#   profile-night-view.svg       — dark bg, blue/teal gradient (recommended)
#   profile-night-green.svg      — dark bg, green bars
#   profile-night-rainbow.svg    — dark bg, rainbow gradient
#   profile-gitblock.svg         — dark 3D block style
#   profile-green.svg            — light bg, green bars
#   profile-green-animate.svg    — light bg, animated
#   profile-season.svg           — seasonal color scheme
#   profile-season-animate.svg   — seasonal animated
#   profile-south-season.svg     — southern hemisphere seasonal
#   profile-south-season-animate.svg

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"  # Daily at 18:00 UTC (03:00 JST) — per official documentation
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3D contribution graph [skip ci]"; then
            git push
          fi
